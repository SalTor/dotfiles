# deck's keys (decision 098). deck reads this through the symlink at
# ~/.config/deck/keys.yaml and never writes it. Anything not listed keeps
# its default, and an action bound here loses its default keys (114);
# Settings, Keys has Copy defaults for the full set.
leader: space
leave_after_send: 0     # ms before the composer lets go after a send; 0 at once, false never (116)

normal:
  leader g i: place.inbox
  leader g l: place.library
  leader g r: place.reminders
  leader g w: place.mywork
  f: hints.open
