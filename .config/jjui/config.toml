[revisions]
revset = "stack() | trunk()"

[[actions]]
name = "workspace-refresh"
lua = '''
jj("workspace", "update-stale");
jj("git", "export");
revisions.refresh();
flash("Successfully ran update-stale and `git export`");
'''

[[bindings]]
action = "workspace-refresh"
key = "ctrl+h"
scope="revisions"
desc = "Run workspace update-stale"

[[actions]]
name = "review-in-tuicr"
lua = '''
local rev = context.change_id()
if not rev then
  flash("No revision selected")
  return
end
exec_shell(string.format("tuicr -r %s", rev))
'''

[[bindings]]
action = "review-in-tuicr"
key = "t"
scope = "revisions"
desc = "Review selected revision in tuicr"

[[actions]]
name = "copy-change-id"
lua = '''
local id = context.change_id()
if not id then
  flash("No revision selected")
  return
end
-- context.change_id() is change_id.shortest() (unique prefix only, often 1-2
-- chars); re-resolve to the 8-char form `jj log` displays.
local out, err = jj("log", "--no-graph", "--ignore-working-copy", "--color=never", "-r", id, "-T", "change_id.shortest(8)")
if not out then
  flash({ text = "Resolve failed: " .. (err or "unknown"), error = true })
  return
end
local full = out:match("^%s*(.-)%s*$")
if full == "" then
  flash({ text = "Resolve failed: empty change id", error = true })
  return
end
local ok, copy_err = copy_to_clipboard(full)
if ok then
  flash("Copied " .. full)
else
  flash({ text = "Copy failed: " .. (copy_err or "unknown"), error = true })
end
'''

[[bindings]]
action = "copy-change-id"
key = "Y"
scope = "revisions"
desc = "copy selected change id to clipboard"
